[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-ml-api"
version = "0.2.0"
description = "SigLIP2, OCR, and Qwen wine recognition API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "huggingface-hub==1.32.0",
  "numpy==2.5.3",
  "pillow==12.3.0",
  "python-multipart==0.0.32",
  "qwen-vl-utils==0.0.14",
  "safetensors==0.8.0",
  "torch==2.14.0",
  "transformers==5.17.0",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1"]

[project.scripts]
wine-api = "wine_api.api:main"
wine-build-index = "wine_api.retrieval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

